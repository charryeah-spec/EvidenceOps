<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">EvidenceOps evidence budgeting</title>
  <desc id="desc">The complete 131-item evidence trail is stored, while a source-diverse set of at most 18 items enters the model prompt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061120"/><stop offset="1" stop-color="#101c35"/></linearGradient>
    <style>.s{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.m{font-family:"SFMono-Regular",Consolas,monospace}.w{fill:#f3f7ff}.u{fill:#91a4bf}.c{fill:#28d7d1}.l{fill:#a8ff3e}.card{fill:#0e1c31;stroke:#29405f;stroke-width:2}.num{font-size:55px;font-weight:800}.label{font-size:22px;font-weight:700}.body{font-size:24px}.title{font-size:58px;font-weight:800}.kick{font-size:18px;font-weight:800;letter-spacing:4px}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="76" y="80" class="m c kick">EVIDENCE SELECTION / AUDITABILITY</text>
  <text x="76" y="150" class="s w title">Preserve everything. Prompt only what matters.</text>
  <text x="76" y="200" class="s u body">A real incident retained 131 typed evidence items; at most 18 localized, anomalous, source-diverse items entered the model context.</text>

  <g class="s">
    <rect x="76" y="286" width="252" height="180" rx="22" class="card"/><text x="108" y="350" class="l num">24</text><text x="108" y="405" class="w label">Metrics</text><text x="108" y="438" class="u" font-size="18">Prometheus / resource signals</text>
    <rect x="354" y="286" width="252" height="180" rx="22" class="card"/><text x="386" y="350" class="l num">16</text><text x="386" y="405" class="w label">Logs</text><text x="386" y="438" class="u" font-size="18">Service and container output</text>
    <rect x="632" y="286" width="252" height="180" rx="22" class="card"/><text x="664" y="350" class="l num">78</text><text x="664" y="405" class="w label">K8s state</text><text x="664" y="438" class="u" font-size="18">Workloads, images, endpoints</text>
    <rect x="910" y="286" width="252" height="180" rx="22" class="card"/><text x="942" y="350" class="l num">11</text><text x="942" y="405" class="w label">K8s events</text><text x="942" y="438" class="u" font-size="18">BackOff and control-plane facts</text>
    <rect x="1188" y="286" width="341" height="180" rx="22" class="card"/><text x="1220" y="350" class="l num">2</text><text x="1220" y="405" class="w label">Retrieved runbooks</text><text x="1220" y="438" class="u" font-size="18">Guidance, never observations</text>
  </g>

  <rect x="76" y="534" width="930" height="210" rx="24" fill="#0d2031" stroke="#28d7d1" stroke-width="2"/>
  <text x="112" y="583" class="m c" font-size="19" font-weight="700">DETERMINISTIC SELECTION POLICY</text>
  <text x="112" y="632" class="s w label">1. Direct fault-control evidence</text><text x="112" y="672" class="s u body">2. Localized high-anomaly evidence   3. Type diversity   4. One bounded runbook</text>
  <text x="112" y="714" class="s u" font-size="20">The complete collection stays in the incident report for review and replay.</text>

  <path d="M1044 639 H1136" stroke="#28d7d1" stroke-width="5"/><path d="M1136 639 l-20 -13 v26 z" fill="#28d7d1"/>
  <rect x="1173" y="534" width="356" height="210" rx="24" fill="#15251f" stroke="#a8ff3e" stroke-width="2"/>
  <text x="1210" y="588" class="m l" font-size="19" font-weight="700">MODEL CONTEXT</text>
  <text x="1210" y="661" class="s l" font-size="72" font-weight="800">≤ 18</text>
  <text x="1210" y="709" class="s w label">evidence items</text>
  <text x="76" y="830" class="s u" font-size="20">Observed optimization example: 337.97 s / 25,925 tokens → 90.43 s / 3,835 tokens</text>
</svg>

